name: Auto Build & Package Mod ZIP

on:
  push:
    branches:
      - main
      - master
    paths:
      - "src/**"
      - "main.js"
      - "mod.yaml"
      - "package.json"
      - "build.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build & Sync Mod Package (van-kiep-tro-ly-mod.zip)
        run: node build.js

      - name: Commit & Push Updated Mod Package if Changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mod.yaml src/core/utils.js src/styles/ui-css.js van-kiep-tro-ly-mod.zip
          if ! git diff --staged --quiet; then
            VER=$(node -p "require('./package.json').version")
            git commit -m "chore(release): auto-build van-kiep-tro-ly-mod.zip v${VER} [skip ci]"
            git push
          else
            echo "van-kiep-tro-ly-mod.zip is already up to date."
          fi
